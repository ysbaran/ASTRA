# Run with:  docker compose up -d --build
# Change the port or the address it listens on with a .env file (see .env.example).
services:
  planet-poems:
    build:
      context: .
      args:
        SELF_HOST_FONTS: "1"
    image: planet-poems:latest
    container_name: planet-poems
    restart: unless-stopped
    ports:
      # BIND_ADDRESS=127.0.0.1 keeps it private to the server (use this behind a reverse proxy).
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8008}:8080"
    # Hardening: nothing inside the container needs to write to disk except /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
