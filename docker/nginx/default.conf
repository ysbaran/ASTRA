# Planet Poems: a static site served by nginx (unprivileged, port 8080).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # it is a read-only site
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # Used by the container health check; not logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The page itself: always revalidate, so a new deploy shows up straight away.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Script, styles and fonts have a content hash in their file name, so they can be
    # cached for a year: a new version gets a new name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
