# Security headers, included by every location that sets its own headers.
# (nginx drops headers inherited from the server block as soon as a location calls add_header,
#  so they are kept in one file and included wherever they are needed.)
#
# Content-Security-Policy:
#   script-src 'self'   only this site's own script files run: no inline or third-party script
#   style-src ...       'unsafe-inline' is needed because the app sets per-element CSS variables
#                       (planet colours, word delays); fonts.googleapis.com is the fallback if the
#                       build could not self-host the fonts
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
